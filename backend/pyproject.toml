[project]
name = "serveai-backend"
version = "0.1.0"
description = "ServeAI autonomous local-services backend"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.137.0",
  "google-api-python-client==2.187.0",
  "google-auth==2.48.0",
  "httpx==0.28.1",
  "langchain==1.2.12",
  "langchain-openai==1.1.11",
  "pydantic-settings==2.13.1",
  "supabase==2.28.2",
  "svix==1.84.1",
  "uvicorn[standard]==0.41.0",
]

[dependency-groups]
dev = [
  "httpx2==2.3.0",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "respx==0.22.0",
  "ruff==0.15.7",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.vercel]
entrypoint = "app.server:app"
